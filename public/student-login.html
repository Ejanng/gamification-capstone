<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/student-login.css">
</head>
<body>
<main>
  <a href="index.html" class="back-link">&larr; Back</a>
  <h1>Student Login</h1>
  <p class="subtitle">Select your name from the class roster to continue.</p>

  <div class="card">
    <form id="student-login-form" autocomplete="off">
      <div class="field-group">
        <label for="student-select">Your name</label>
        <select id="student-select" required>
          <option value="" disabled selected>Loading roster...</option>
        </select>
      </div>
      <button type="submit" id="student-login-btn">Log in</button>
      <div id="login-error"></div>
    </form>
  </div>
</main>

<script>
const API_BASE = '/api';
const select = document.getElementById('student-select');
const form = document.getElementById('student-login-form');
const loginBtn = document.getElementById('student-login-btn');
const errorEl = document.getElementById('login-error');

async function loadRoster() {
  try {
    const res = await fetch(`${API_BASE}/users`);
    if (!res.ok) throw new Error('Failed to load roster');
    const users = await res.json();

    select.innerHTML = '<option value="" disabled selected>Choose your name...</option>';
    users.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = u.section ? `${u.name} (${u.section})` : u.name;
      select.appendChild(opt);
    });
  } catch (err) {
    select.innerHTML = '<option value="" disabled selected>Could not load roster</option>';
    errorEl.textContent = 'Could not reach the server. Is it running?';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.textContent = '';
  const studentId = select.value;
  if (!studentId) return;

  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';

  try {
    const res = await fetch(`${API_BASE}/auth/student-login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentId })
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || 'Login failed');
    }
    const session = await res.json();
    localStorage.setItem('session', JSON.stringify(session));
    window.location.href = 'student-dashboard.html';
  } catch (err) {
    errorEl.textContent = err.message;
    loginBtn.disabled = false;
    loginBtn.textContent = 'Log in';
  }
});

loadRoster();
</script>
</body>
</html>
