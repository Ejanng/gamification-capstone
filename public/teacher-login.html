<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/teacher-login.css">
</head>
<body>
<main>
  <a href="index.html" class="back-link">&larr; Back</a>
  <h1>Teacher Login</h1>
  <p class="subtitle">Sign in to manage quizzes and view student progress.</p>

  <div class="card">
    <form id="teacher-login-form" autocomplete="off">
      <div class="field-group">
        <label for="teacher-username">Username</label>
        <input type="text" id="teacher-username" required autocomplete="username">
      </div>
      <div class="field-group">
        <label for="teacher-password">Password</label>
        <input type="password" id="teacher-password" required autocomplete="current-password">
      </div>
      <button type="submit" id="teacher-login-btn">Log in</button>
      <div id="login-error"></div>
    </form>
  </div>
</main>

<script>
const API_BASE = '/api';
const form = document.getElementById('teacher-login-form');
const loginBtn = document.getElementById('teacher-login-btn');
const errorEl = document.getElementById('login-error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.textContent = '';

  const username = document.getElementById('teacher-username').value.trim();
  const password = document.getElementById('teacher-password').value;

  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';

  try {
    const res = await fetch(`${API_BASE}/auth/teacher-login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || 'Login failed');
    }
    const session = await res.json();
    localStorage.setItem('session', JSON.stringify(session));
    window.location.href = 'teacher-dashboard.html';
  } catch (err) {
    errorEl.textContent = err.message;
    loginBtn.disabled = false;
    loginBtn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
