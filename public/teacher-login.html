<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7FB; --surface:#FFFFFF; --ink:#1B1D2A; --ink-muted:#5A5D74;
    --indigo:#3A3D8F; --indigo-dark:#2B2E6E;
    --border:#E1E2EC; --red:#D64545; --radius-sm:6px; --radius-lg:14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Inter', system-ui, sans-serif; }
  body{ display:flex; align-items:center; justify-content:center; padding:24px; }
  main{ width:100%; max-width:380px; }
  a.back-link{ display:inline-block; margin-bottom:18px; font-size:13px; color:var(--ink-muted); text-decoration:none; }
  h1{ font-family:'Space Grotesk', sans-serif; font-size:21px; font-weight:600; margin:0 0 4px; }
  p.subtitle{ color:var(--ink-muted); font-size:13.5px; margin:0 0 24px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; }
  .field-group{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field-group label{ font-size:12.5px; font-weight:600; color:var(--ink-muted); }
  input[type="text"], input[type="password"]{
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px; font-family:inherit; font-size:14px; color:var(--ink); background:#fff; width:100%;
  }
  input:focus{ outline:2px solid var(--indigo); outline-offset:1px; border-color:var(--indigo); }
  button{
    width:100%; font-family:inherit; font-size:14px; font-weight:600;
    border-radius:var(--radius-sm); padding:11px 16px; border:none;
    background:var(--indigo); color:#fff; cursor:pointer;
  }
  button:hover{ background:var(--indigo-dark); }
  button:disabled{ background:#B9BBDA; cursor:not-allowed; }
  #login-error{ color:var(--red); font-size:12.5px; min-height:16px; margin-top:10px; }
</style>
</head>
<body>
<main>
  <a href="index.html" class="back-link">&larr; Back</a>
  <h1>Teacher Login</h1>
  <p class="subtitle">Sign in to manage quizzes and view student progress.</p>

  <div class="card">
    <form id="teacher-login-form" autocomplete="off">
      <div class="field-group">
        <label for="teacher-username">Username</label>
        <input type="text" id="teacher-username" required autocomplete="username">
      </div>
      <div class="field-group">
        <label for="teacher-password">Password</label>
        <input type="password" id="teacher-password" required autocomplete="current-password">
      </div>
      <button type="submit" id="teacher-login-btn">Log in</button>
      <div id="login-error"></div>
    </form>
  </div>
</main>

<script>
const API_BASE = '/api';
const form = document.getElementById('teacher-login-form');
const loginBtn = document.getElementById('teacher-login-btn');
const errorEl = document.getElementById('login-error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.textContent = '';

  const username = document.getElementById('teacher-username').value.trim();
  const password = document.getElementById('teacher-password').value;

  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';

  try {
    const res = await fetch(`${API_BASE}/auth/teacher-login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || 'Login failed');
    }
    const session = await res.json();
    localStorage.setItem('session', JSON.stringify(session));
    window.location.href = 'teacher-dashboard.html';
  } catch (err) {
    errorEl.textContent = err.message;
    loginBtn.disabled = false;
    loginBtn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
