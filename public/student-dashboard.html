<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7FB; --surface:#FFFFFF; --ink:#1B1D2A; --ink-muted:#5A5D74;
    --indigo:#3A3D8F; --indigo-dark:#2B2E6E; --gold:#F5A623; --gold-soft:#FDECC8;
    --teal:#2BB673; --border:#E1E2EC; --radius-sm:6px; --radius-md:10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', system-ui, sans-serif; }
  h1,h2{ font-family:'Space Grotesk', sans-serif; margin:0; }

  header.app-header{
    background:var(--indigo); color:#fff; padding:18px 32px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header.app-header h1{ font-size:19px; font-weight:600; }
  #welcome-text{ font-size:12.5px; color:#C7C9E8; margin-top:2px; }
  #logout-btn{
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
    color:#fff; font-family:inherit; font-size:13px; font-weight:500;
    padding:7px 14px; border-radius:20px; cursor:pointer;
  }
  #logout-btn:hover{ background:rgba(255,255,255,0.2); }

  main{ max-width:900px; margin:0 auto; padding:28px 32px 48px; }

  #quiz-list{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }

  .quiz-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .quiz-card-info{ display:flex; flex-direction:column; gap:6px; }
  .quiz-card-title{ font-size:15.5px; font-weight:600; }
  .quiz-card-meta{ font-size:12.5px; color:var(--ink-muted); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  .quiz-type-tag{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; }
  .quiz-type-tag.pre-test{ background:var(--gold-soft); color:#9A6B00; }
  .quiz-type-tag.post-test{ background:#E1E9FB; color:#2B4B8F; }
  .quiz-type-tag.gamified{ background:#E8F8F0; color:#1D8A5A; }

  .status-pill{ font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:12px; }
  .status-pill.done{ background:#E8F8F0; color:var(--teal); }
  .status-pill.todo{ background:#EFF0FA; color:var(--indigo); }

  .btn{
    font-family:inherit; font-size:13.5px; font-weight:600; border-radius:var(--radius-sm);
    padding:9px 18px; border:1px solid transparent; cursor:pointer; text-decoration:none; display:inline-block;
  }
  .btn-primary{ background:var(--indigo); color:#fff; }
  .btn-primary:hover{ background:var(--indigo-dark); }
  .btn-disabled{ background:#EAEAF2; color:var(--ink-muted); cursor:default; pointer-events:none; }

  #empty-state{ text-align:center; padding:48px 16px; color:var(--ink-muted); font-size:13.5px; }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>My Quizzes</h1>
    <div id="welcome-text">Loading...</div>
  </div>
  <button id="logout-btn">Log out</button>
</header>

<main>
  <h2>Activities</h2>
  <div id="quiz-list"></div>
  <div id="empty-state" style="display:none;">No quizzes have been assigned yet. Check back later.</div>
</main>

<script>
const API_BASE = '/api';

function getSession() {
  const raw = localStorage.getItem('session');
  if (!raw) return null;
  try {
    const session = JSON.parse(raw);
    return session.role === 'student' ? session : null;
  } catch {
    return null;
  }
}

const session = getSession();
if (!session) {
  window.location.href = 'student-login.html';
}

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('session');
  window.location.href = 'index.html';
});

const quizTypeLabels = {
  'pre-test': 'Pre-Test',
  'post-test': 'Post-Test',
  'gamified': 'Gamified Activity'
};

async function loadDashboard() {
  document.getElementById('welcome-text').textContent = `Signed in as ${session.name}`;

  try {
    const [quizzesRes, resultsRes] = await Promise.all([
      fetch(`${API_BASE}/quizzes`),
      fetch(`${API_BASE}/results`)
    ]);
    const quizzes = await quizzesRes.json();
    const results = await resultsRes.json();

    const myResults = results.filter(r => r.userId === session.id);
    const completedQuizIds = new Set(myResults.map(r => r.quizId));

    renderQuizList(quizzes, completedQuizIds);
  } catch (err) {
    console.error('Failed to load dashboard:', err);
    document.getElementById('quiz-list').innerHTML =
      '<div id="empty-state">Could not load quizzes. Is the server running?</div>';
  }
}

function renderQuizList(quizzes, completedQuizIds) {
  const listEl = document.getElementById('quiz-list');
  const emptyEl = document.getElementById('empty-state');

  if (!quizzes.length) {
    emptyEl.style.display = 'block';
    return;
  }

  listEl.innerHTML = '';
  quizzes.forEach(quiz => {
    const isDone = completedQuizIds.has(quiz.id);
    const quizType = quiz.quizType || 'gamified';

    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.dataset.quizId = quiz.id;

    card.innerHTML = `
      <div class="quiz-card-info">
        <div class="quiz-card-title"></div>
        <div class="quiz-card-meta">
          <span class="quiz-type-tag ${quizType}">${quizTypeLabels[quizType] || quizType}</span>
          <span class="status-pill ${isDone ? 'done' : 'todo'}">${isDone ? 'Completed' : 'To do'}</span>
          <span>${quiz.questions ? quiz.questions.length : 0} question${quiz.questions && quiz.questions.length === 1 ? '' : 's'}</span>
        </div>
      </div>
    `;
    card.querySelector('.quiz-card-title').textContent = quiz.title;

    const actionWrap = document.createElement('div');
    if (isDone) {
      const span = document.createElement('span');
      span.className = 'btn btn-disabled';
      span.textContent = 'Completed';
      actionWrap.appendChild(span);
    } else {
      const link = document.createElement('a');
      link.className = 'btn btn-primary';
      link.href = `student-app.html?quizId=${encodeURIComponent(quiz.id)}`;
      link.textContent = 'Start';
      actionWrap.appendChild(link);
    }
    card.appendChild(actionWrap);

    listEl.appendChild(card);
  });
}

loadDashboard();
</script>
</body>
</html>
